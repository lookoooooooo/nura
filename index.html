<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NURA - Start</title>
  <style>
    body {
      background: #050505;
      color: #fff;
      font-family: 'Courier New', monospace;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .main-frame {
      width: 100%;
      max-width: 440px;
      background: #0a0a0a;
      border: 2px solid #333;
      padding: 30px;
      box-sizing: border-box;
      border-radius: 8px;
    }
    .search-container {
      position: relative;
      margin-bottom: 25px;
    }
    .search-box {
      display: flex;
      align-items: center;
      background: #111;
      border: 1px solid #333;
      padding: 5px 10px;
      border-radius: 4px;
    }
    .search-icon {
      margin-right: 8px;
    }
    #search-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-family: inherit;
      outline: none;
    }
    #search-btn {
      background: #00f0ff;
      border: none;
      color: #000;
      font-weight: bold;
      padding: 4px 10px;
      cursor: pointer;
    }
    .suggestions-menu {
      position: absolute;
      top: 40px;
      left: 0;
      width: 100%;
      background: #0d0d0d;
      border: 1px solid #00f0ff;
      box-shadow: 0 5px 15px rgba(0,240,255,0.2);
      z-index: 100;
      border-radius: 4px;
      box-sizing: border-box;
    }
    .suggest-item {
      padding: 10px;
      cursor: pointer;
      font-size: 13px;
      border-bottom: 1px solid #222;
    }
    .suggest-item:hover {
      background: #15222e;
      color: #00f0ff;
    }
    .cyber-gate {
      text-align: center;
      border: 1px solid #ff0055;
      padding: 20px;
      background: #0d0408;
    }
    .gate-title {
      color: #ff0055;
      font-weight: bold;
    }
    .field-wrap {
      display: flex;
      align-items: center;
      background: #111;
      border: 1px solid #333;
      margin-top: 10px;
      padding: 5px 10px;
    }
    .prefix {
      color: #ff0055;
      font-size: 11px;
      margin-right: 8px;
    }
    .field-wrap input {
      width: 100%;
      background: transparent;
      border: none;
      color: #fff;
      font-family: inherit;
      outline: none;
    }
    #bday {
      color-scheme: dark;
    }
    #reg-go {
      background: #ff0055;
      border: none;
      color: #fff;
      padding: 10px;
      width: 100%;
      margin-top: 15px;
      cursor: pointer;
      font-weight: bold;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="main-frame">
    <div class="search-container">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Search the internet..." autocomplete="off">
        <button id="search-btn">GO</button>
      </div>
      <div id="suggestions" class="suggestions-menu hidden">
        <div class="suggest-item">hatsune miku</div>
        <div class="suggest-item">creepy story</div>
        <div class="suggest-item">kaomoji</div>
        <div class="suggest-item">cat</div>
      </div>
    </div>

    <div id="reg-form" class="cyber-gate">
      <div class="gate-title">ACCESS DENIED</div>
      <div class="field-wrap">
        <span class="prefix">> CODENAME:</span>
        <input type="text" id="nick" placeholder="Enter nickname...">
      </div>
      <div class="field-wrap">
        <span class="prefix">> PASSWORD:</span>
        <input type="password" id="pass" placeholder="••••••••">
      </div>
      <div class="field-wrap">
        <span class="prefix">> BIRTHDAY:</span>
        <input type="date" id="bday">
      </div>
      <button id="reg-go">INITIALIZE LOGIN</button>
    </div>
  </div>

  <script>
    const sInp = document.getElementById('search-input');
    const sBtn = document.getElementById('search-btn');
    const sugMenu = document.getElementById('suggestions');
    const go = document.getElementById('reg-go');

    const globalBannedRegex = /хуй|хуе|хуи|пизд|ебан|ебат|уеб|бля|сук|залуп|мудак|шлюх|нах|член|fuc?k|bitch|shit|ass|cock|dick|cunt|pussy|whore|bastard|nigga|idiot|stupid|baka|クソ|バカ|アホ|チンポ|マンコ/vi;
    function clean(text) { return text.replace(globalBannedRegex, '***'); }

    const nickInput = document.getElementById('nick');
    nickInput.addEventListener('input', () => nickInput.value = clean(nickInput.value));

    sInp.addEventListener('focus', () => {
      sugMenu.classList.remove('hidden');
    });

    document.addEventListener('click', (e) => {
      if (!sInp.contains(e.target) && !sugMenu.contains(e.target)) {
        sugMenu.classList.add('hidden');
      }
    });

    document.querySelectorAll('.suggest-item').forEach(item => {
      item.addEventListener('click', () => {
        sInp.value = item.textContent;
        sugMenu.classList.add('hidden');
      });
    });

    function doSearch() {
      const q = sInp.value.trim().toLowerCase();
      if (q) {
        window.location.href = `result.html?q=${encodeURIComponent(q)}`;
      }
    }

    sBtn.addEventListener('click', doSearch);
    sInp.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') doSearch();
    });

    go.addEventListener('click', () => {
      const name = nickInput.value.trim();
      const pass = document.getElementById('pass').value;
      const bday = document.getElementById('bday').value;
      if (!name || !pass || !bday) {
        alert('Fill all fields!');
        return;
      }
      localStorage.setItem('nura_username', name);
      alert('Identity Saved!');
      document.getElementById('reg-form').classList.add('hidden');
    });
  </script>
</body>
</html>
