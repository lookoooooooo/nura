<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✧ nura ✧</title>
    <style>
        @import url('https://googleapis.com');

        body {
            background-color: #1e351e; 
            background-image: radial-gradient(#152515 15%, transparent 16%);
            background-size: 16px 16px;
            font-family: 'Courier Prime', 'Courier', monospace;
            color: #1b1008;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .window {
            background: #f7e3af;
            border: 3px solid #6b1d1d;
            box-shadow: 6px 6px 0px #351010;
            max-width: 600px;
            width: 100%;
            margin-top: 40px;
            image-rendering: pixelated;
            display: none;
        }

        .window-header {
            background: #872525;
            color: #ffe6bd;
            padding: 8px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            border-bottom: 3px solid #6b1d1d;
        }

        .window-dots span {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #f7e3af;
            border: 2px solid #6b1d1d;
            margin-left: 4px;
            cursor: pointer;
        }

        .window-body {
            padding: 20px;
            line-height: 1.5;
        }

        h1 {
            font-size: 28px;
            margin-top: 0;
            margin-bottom: 5px;
            color: #6b1d1d;
        }

        .slogan {
            font-size: 16px;
            font-weight: bold;
            color: #4a341e;
            margin-bottom: 20px;
        }

        marquee {
            background: #2b3d2b;
            color: #e3ffd4;
            border: 2px solid #6b1d1d;
            padding: 5px;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .search-container {
            margin: 15px 0;
            position: relative;
        }

        .search-box {
            display: flex;
            gap: 8px;
        }

        .search-input {
            flex-grow: 1;
            padding: 8px;
            border: 3px solid #6b1d1d;
            background: #fffcf2;
            color: #1b1008;
            font-family: inherit;
            font-size: 14px;
        }

        .search-input:focus {
            outline: none;
            background: #ffffff;
        }

        .suggestions-box {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #fffcf2;
            border: 3px solid #6b1d1d;
            z-index: 10;
            display: none;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.3);
        }

        .suggestion-item {
            padding: 8px;
            font-size: 14px;
            cursor: pointer;
            color: #1b1008;
        }

        .suggestion-item:hover {
            background: #872525;
            color: #ffe6bd;
        }

        .btn {
            display: inline-block;
            background: #f7b859;
            border: 2px solid #6b1d1d;
            padding: 8px 16px;
            color: #2b1100;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 3px 3px 0px #6b1d1d;
            cursor: pointer;
            margin-right: 10px;
            font-size: 13px;
            text-align: center;
        }

        .btn:active {
            box-shadow: 0px 0px 0px #6b1d1d;
            transform: translate(3px, 3px);
        }

        .status-bar {
            border-top: 2px dashed #6b1d1d;
            margin-top: 20px;
            padding-top: 10px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            color: #4a341e;
        }

        #reg-window {
            display: block;
            max-width: 400px;
            margin-top: 10vh;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .input-text {
            width: 100%;
            padding: 8px;
            border: 3px solid #6b1d1d;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 14px;
            background: #fffcf2;
        }

        .avatar-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            margin-top: 5px;
            background: #fffcf2;
            padding: 8px;
            border: 2px solid #6b1d1d;
        }

        .avatar-option {
            font-size: 24px;
            text-align: center;
            cursor: pointer;
            padding: 4px;
            border: 2px solid transparent;
        }

        .avatar-option:hover {
            background: #f7b859;
        }

        .avatar-option.selected {
            border-color: #6b1d1d;
            background: #872525;
        }

        #profile-widget {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #f7e3af;
            border: 3px solid #6b1d1d;
            box-shadow: 4px 4px 0px #351010;
            padding: 10px;
            display: none;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            z-index: 100;
        }

        #profile-widget:hover {
            background: #fffcf2;
        }

        #widget-avatar {
            font-size: 28px;
        }

        #widget-name {
            font-weight: bold;
            font-size: 13px;
            color: #6b1d1d;
        }

        #edit-window {
            max-width: 400px;
            position: fixed;
            top: 15vh;
            z-index: 101;
        }

        .user-info-card {
            background: #f7b859;
            border: 2px dashed #6b1d1d;
            padding: 12px;
            margin-top: 15px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .user-info-avatar {
            font-size: 42px;
        }

        .user-info-text {
            font-size: 13px;
        }

        .user-info-name {
            font-weight: bold;
            margin-bottom: 4px;
            color: #6b1d1d;
        }
    </style>
</head>
<body>

    <div id="profile-widget" onclick="openEdit()">
        <div id="widget-avatar">🍒</div>
        <div id="widget-name">Guest</div>
    </div>

    <div id="reg-window" class="window">
        <div class="window-header">
            <span class="window-title">sign_up.exe</span>
            <div class="window-dots"><span></span><span></span><span></span></div>
        </div>
        <div class="window-body">
            <div class="form-group">
                <label>username:</label>
                <input type="text" id="reg-username" class="input-text" value="lookooooooo">
            </div>
            <div class="form-group">
                <label>bio:</label>
                <input type="text" id="reg-bio" class="input-text" value="just another internet surfer">
            </div>
            <div class="form-group">
                <label>avatar:</label>
                <div class="avatar-grid" id="reg-avatar-grid"></div>
            </div>
            <div style="margin-top: 20px; text-align: right;">
                <button class="btn" onclick="saveRegistration()">submit</button>
            </div>
        </div>
    </div>

    <div id="main-window" class="window">
        <div class="window-header">
            <span class="window-title">nura.exe</span>
            <div class="window-dots"><span></span><span></span><span></span></div>
        </div>
        <div class="window-body">
            <marquee scrollamount="4">✦ 一癖あるインターネット ✦ welcome to nura ✦ 一癖あるインターネット ✦</marquee>
            
            <h1>nura</h1>
            <div class="slogan">一癖あるインターネット</div>

            <div class="search-container">
                <form action="result.html" method="get" class="search-box">
                    <input type="text" name="q" id="search-bar" class="search-input" placeholder="Search internet..." oninput="showSuggestions(this.value)" autocomplete="off">
                    <button type="submit" class="btn">Find</button>
                </form>
                <div id="suggestions" class="suggestions-box"></div>
            </div>
            
            <p>✦ entry_001.log</p>
            
            <div class="user-info-card">
                <div class="user-info-avatar" id="main-display-avatar">🍒</div>
                <div class="user-info-text">
                    <div class="user-info-name" id="main-display-name">Guest</div>
                    <div id="main-display-bio">...</div>
                </div>
            </div>
            
            <div style="margin-top: 25px;">
                <a class="btn">enter</a>
                <a class="btn" style="background: #ffcbdc;">index</a>
            </div>

            <div class="status-bar">
                <span>status: online</span>
                <span>hits: 000001</span>
            </div>
        </div>
    </div>

    <div id="edit-window" class="window">
        <div class="window-header">
            <span class="window-title">edit_profile.exe</span>
            <div class="window-dots"><span onclick="closeEdit()"></span><span></span><span></span></div>
        </div>
        <div class="window-body">
            <div class="form-group">
    <script>
        const emojis = ['🍡', '🎀', '🥕', '🦋', '🪀', '🎱', '🍔', '🍒', '🥝', '🍏', '🍎', '🍧', '🍮', '🥮', '🍭', '🍰', '🌰', '🍯', '🍬', '🥛', '🍼', '🎸', '🩰', '🎨', '🥳'];
        let selectedAvatar = '🍒';

        const searchItems = [
            "hatsune miku",
            "apple pie recipe",
            "neko",
            "lookooooooo(✿◠‿◠)"
        ];

        function initAvatars(gridId, onClickCallback) {
            const grid = document.getElementById(gridId);
            grid.innerHTML = '';
            emojis.forEach((emoji) => {
                const item = document.createElement('div');
                item.className = 'avatar-option';
                if (emoji === selectedAvatar) item.classList.add('selected');
                item.textContent = emoji;
                item.onclick = () => {
                    document.querySelectorAll(`#${gridId} .avatar-option`).forEach(el => el.classList.remove('selected'));
                    item.classList.add('selected');
                    onClickCallback(emoji);
                };
                grid.appendChild(item);
            });
        }

        function showSuggestions(val) {
            const box = document.getElementById('suggestions');
            box.innerHTML = '';
            if (!val) {
                box.style.display = 'none';
                return;
            }
            const filtered = searchItems.filter(item => item.toLowerCase().includes(val.toLowerCase()));
            if (filtered.length === 0) {
                box.style.display = 'none';
                return;
            }
            filtered.forEach(item => {
                const div = document.createElement('div');
                div.className = 'suggestion-item';
                div.textContent = item;
                div.onclick = () => {
                    document.getElementById('search-bar').value = item;
                    box.style.display = 'none';
                    window.location.href = `result.html?q=${encodeURIComponent(item)}`;
                };
                box.appendChild(div);
            });
            box.style.display = 'block';
        }

        document.addEventListener('click', function(e) {
            if (!e.target.classList.contains('search-input')) {
                document.getElementById('suggestions').style.display = 'none';
            }
        });

        function saveRegistration() {
            const username = document.getElementById('reg-username').value || 'lookooooooo';
            const bio = document.getElementById('reg-bio').value || 'just another internet surfer';
            
            localStorage.setItem('nura_user', JSON.stringify({ username, bio, avatar: selectedAvatar }));
            applyUserData(username, bio, selectedAvatar);
            
            document.getElementById('reg-window').style.display = 'none';
            document.getElementById('main-window').style.display = 'block';
            document.getElementById('profile-widget').style.display = 'flex';
        }

        function applyUserData(name, bio, avatar) {
            document.getElementById('widget-name').textContent = name;
            document.getElementById('widget-avatar').textContent = avatar;
            document.getElementById('main-display-name').textContent = name;
            document.getElementById('main-display-bio').textContent = bio;
            document.getElementById('main-display-avatar').textContent = avatar;
        }

        function openEdit() {
            const data = JSON.parse(localStorage.getItem('nura_user'));
            if (!data) return;

            document.getElementById('edit-username').value = data.username;
            document.getElementById('edit-bio').value = data.bio;
            selectedAvatar = data.avatar;

            initAvatars('edit-avatar-grid', (emoji) => { selectedAvatar = emoji; });
            document.getElementById('edit-window').style.display = 'block';
        }

        function closeEdit() {
            document.getElementById('edit-window').style.display = 'none';
        }

        function saveEdit() {
            const username = document.getElementById('edit-username').value || 'lookooooooo';
            const bio = document.getElementById('edit-bio').value || 'just another internet surfer';

            localStorage.setItem('nura_user', JSON.stringify({ username, bio, avatar: selectedAvatar }));
            applyUserData(username, bio, selectedAvatar);
            closeEdit();
        }

        window.onload = function() {
            const savedData = localStorage.getItem('nura_user');
            initAvatars('reg-avatar-grid', (emoji) => { selectedAvatar = emoji; });

            if (savedData) {
                const data = JSON.parse(savedData);
                selectedAvatar = data.avatar;
                applyUserData(data.username, data.bio, data.avatar);
                
                document.getElementById('reg-window').style.display = 'none';
                document.getElementById('main-window').style.display = 'block';
                document.getElementById('profile-widget').style.display = 'flex';
            }
        };
    </script>
