<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NURA</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        p {
            font-size: 1.2rem;
            color: #8b949e;
            margin-bottom: 30px;
        }
        .search-box {
            position: relative;
            display: inline-block;
        }
        input[type="text"] {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            padding: 10px 15px;
            font-size: 1rem;
            width: 300px;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #58a6ff;
        }
        button {
            background-color: #21262d;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
            margin-left: 10px;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #30363d;
            border-color: #8b949e;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>NURA</h1>
    <p>一癖あるインターネット — An internet with a twist.</p>
    
    <div class="search-box">
        <input type="text" id="query" placeholder="SEARCH...">
        <button onclick="executeSearch()">GO</button>
    </div>
</div>

<script>
    function executeSearch() {
        const query = document.getElementById('query').value;
        if (query.trim() !== "") {
            window.location.href = "https://google.com" + encodeURIComponent(query);
        }
    }
    
    document.getElementById('query').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            executeSearch();
        }
    });
</script>

</body>
</html>
