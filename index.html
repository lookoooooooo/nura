<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✧ nura ✧</title>
    <style>
        @import url('https://googleapis.com');

        body {
            background-color: #dbf0db; 
            background-image: radial-gradient(#b2dbb2 15%, transparent 16%);
            background-size: 16px 16px;
            font-family: 'Courier Prime', 'Courier', monospace;
            color: #2c4c2c;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .window {
            background: #ffffff;
            border: 3px solid #2c4c2c;
            box-shadow: 6px 6px 0px #8ebf8e;
            max-width: 600px;
            width: 100%;
            margin-top: 40px;
            image-rendering: pixelated;
            display: none;
        }

        .window-header {
            background: repeating-linear-gradient(45deg, #a4dba4, #a4dba4 10px, #bcedbc 10px, #bcedbc 20px);
            border-bottom: 3px solid #2c4c2c;
            padding: 8px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
        }

        .window-dots span {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #ffffff;
            border: 2px solid #2c4c2c;
            margin-left: 4px;
            cursor: pointer;
        }

        .window-body {
            padding: 20px;
            line-height: 1.5;
        }

        h1 {
            font-size: 28px;
            margin-top: 0;
            margin-bottom: 5px;
            color: #3b6b3b;
            text-shadow: 2px 2px 0px #c2ecc2;
        }

        .slogan {
            font-size: 16px;
            font-weight: bold;
            color: #2c4c2c;
            margin-bottom: 20px;
        }

        marquee {
            background: #f0fbf0;
            border: 1px dashed #2c4c2c;
            padding: 5px;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .btn {
            display: inline-block;
            background: #fff3cd;
            border: 2px solid #2c4c2c;
            padding: 8px 16px;
            color: #2c4c2c;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 3px 3px 0px #2c4c2c;
            cursor: pointer;
            margin-right: 10px;
            font-size: 13px;
            text-align: center;
        }

        .btn:active {
            box-shadow: 0px 0px 0px #2c4c2c;
            transform: translate(3px, 3px);
        }

        .status-bar {
            border-top: 2px dashed #2c4c2c;
            margin-top: 20px;
            padding-top: 10px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
        }

        #reg-window {
            display: block;
            max-width: 400px;
            margin-top: 10vh;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .input-text {
            width: 100%;
            padding: 8px;
            border: 2px solid #2c4c2c;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 14px;
            background: #fbfdfb;
        }

        .input-text:focus {
            outline: none;
            background: #ffffff;
        }

        .avatar-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            margin-top: 5px;
            background: #f0fbf0;
            padding: 8px;
            border: 1px dashed #2c4c2c;
        }

        .avatar-option {
            font-size: 24px;
            text-align: center;
            cursor: pointer;
            padding: 4px;
            border: 2px solid transparent;
        }

        .avatar-option:hover {
            background: #bcedbc;
        }

        .avatar-option.selected {
            border-color: #2c4c2c;
            background: #fff3cd;
        }

        #profile-widget {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #ffffff;
            border: 2px solid #2c4c2c;
            box-shadow: 4px 4px 0px #8ebf8e;
            padding: 10px;
            display: none;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            z-index: 100;
        }

        #profile-widget:hover {
            background: #fbfdfb;
        }

        #widget-avatar {
            font-size: 28px;
        }

        #widget-name {
            font-weight: bold;
            font-size: 13px;
            max-width: 100px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #edit-window {
            max-width: 400px;
            position: fixed;
            top: 15vh;
            z-index: 101;
        }

        .user-info-card {
            background: #fff3cd;
            border: 2px dashed #2c4c2c;
            padding: 12px;
            margin-top: 15px;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .user-info-avatar {
            font-size: 42px;
        }

        .user-info-text {
            font-size: 13px;
        }

        .user-info-name {
            font-weight: bold;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <div id="profile-widget" onclick="openEdit()">
        <div id="widget-avatar">🍡</div>
        <div id="widget-name">Guest</div>
    </div>

    <div id="reg-window" class="window">
        <div class="window-header">
            <span class="window-title">✧ sign_up.exe ✦</span>
            <div class="window-dots"><span></span><span></span><span></span></div>
        </div>
        <div class="window-body">
            <div class="form-group">
                <label>username:</label>
                <input type="text" id="reg-username" class="input-text" value="anonymous">
            </div>
            <div class="form-group">
                <label>bio:</label>
                <input type="text" id="reg-bio" class="input-text" value="just another internet surfer">
            </div>
            <div class="form-group">
                <label>avatar:</label>
                <div class="avatar-grid" id="reg-avatar-grid"></div>
            </div>
            <div style="margin-top: 20px; text-align: right;">
                <button class="btn" onclick="saveRegistration()">submit</button>
            </div>
        </div>
    </div>

    <div id="main-window" class="window">
        <div class="window-header">
            <span class="window-title">✧ nura.exe ✦</span>
            <div class="window-dots"><span></span><span></span><span></span></div>
        </div>
        <div class="window-body">
            <marquee scrollamount="4">✦ 一癖あるインターネット ✦ welcome to nura ✦ 一癖あるインターネット ✦</marquee>
            
            <h1>nura</h1>
            <div class="slogan">一癖あるインターネット</div>
            
            <p>✦ entry_001.log</p>
            
            <div class="user-info-card">
                <div class="user-info-avatar" id="main-display-avatar">🍡</div>
                <div class="user-info-text">
                    <div class="user-info-name" id="main-display-name">Guest</div>
                    <div id="main-display-bio">...</div>
                </div>
            </div>
            
            <div style="margin-top: 25px;">
                <a class="btn">enter</a>
                <a class="btn" style="background: #ffd3e2;">index</a>
            </div>

            <div class="status-bar">
                <span>status: online</span>
                <span>hits: 000001</span>
            </div>
        </div>
    </div>

    <div id="edit-window" class="window">
        <div class="window-header">
            <span class="window-title">✧ edit_profile.exe ✦</span>
            <div class="window-dots"><span onclick="closeEdit()"></span><span></span><span></span></div>
        </div>
        <div class="window-body">
            <div class="form-group">
                <label>edit username:</label>
                <input type="text" id="edit-username" class="input-text">
            </div>
            <div class="form-group">
                <label>edit bio:</label>
                <input type="text" id="edit-bio" class="input-text">
            </div>
            <div class="form-group">
                <label>edit avatar:</label>
                <div class="avatar-grid" id="edit-avatar-grid"></div>
            </div>
            <div style="margin-top: 20px; display: flex; justify-content: space-between;">
                <button class="btn" style="background: #ffcbdc;" onclick="closeEdit()">cancel</button>
                <button class="btn" onclick="saveEdit()">update</button>
            </div>
        </div>
    </div>   
    
    <script>
        const emojis = ['🍡', '🎀', '🥕', '🦋', '🪀', '🎱', '🍔', '🍒', '🥝', '🍏', '🍎', '🍧', '🍮', '🥮', '🍭', '🍰', '🌰', '🍯', '🍬', '🥛', '🍼', '🎸', '🩰', '🎨', '🥳'];
        let selectedAvatar = emojis[0];

        function initAvatars(gridId, onClickCallback) {
            const grid = document.getElementById(gridId);
            grid.innerHTML = '';
            emojis.forEach((emoji) => {
                const item = document.createElement('div');
                item.className = 'avatar-option';
                if (emoji === selectedAvatar) item.classList.add('selected');
                item.textContent = emoji;
                item.onclick = () => {
                    document.querySelectorAll(`#${gridId} .avatar-option`).forEach(el => el.classList.remove('selected'));
                    item.classList.add('selected');
                    onClickCallback(emoji);
                };
                grid.appendChild(item);
            });
        }

        function saveRegistration() {
            const username = document.getElementById('reg-username').value || 'anonymous';
            const bio = document.getElementById('reg-bio').value || '...';
            
            localStorage.setItem('nura_user', JSON.stringify({ username, bio, avatar: selectedAvatar }));
            
            applyUserData(username, bio, selectedAvatar);
            
            document.getElementById('reg-window').style.display = 'none';
            document.getElementById('main-window').style.display = 'block';
            document.getElementById('profile-widget').style.display = 'flex';
        }

        function applyUserData(name, bio, avatar) {
            document.getElementById('widget-name').textContent = name;
            document.getElementById('widget-avatar').textContent = avatar;
            document.getElementById('main-display-name').textContent = name;
            document.getElementById('main-display-bio').textContent = bio;
            document.getElementById('main-display-avatar').textContent = avatar;
        }

        function openEdit() {
            const data = JSON.parse(localStorage.getItem('nura_user'));
            if (!data) return;

            document.getElementById('edit-username').value = data.username;
            document.getElementById('edit-bio').value = data.bio;
            selectedAvatar = data.avatar;

            initAvatars('edit-avatar-grid', (emoji) => { selectedAvatar = emoji; });
            document.getElementById('edit-window').style.display = 'block';
        }

        function closeEdit() {
            document.getElementById('edit-window').style.display = 'none';
        }

        function saveEdit() {
            const username = document.getElementById('edit-username').value || 'anonymous';
            const bio = document.getElementById('edit-bio').value || '...';

            localStorage.setItem('nura_user', JSON.stringify({ username, bio, avatar: selectedAvatar }));
            applyUserData(username, bio, selectedAvatar);
            closeEdit();
        }

        window.onload = function() {
            const savedData = localStorage.getItem('nura_user');
            initAvatars('reg-avatar-grid', (emoji) => { selectedAvatar = emoji; });

            if (savedData) {
                const data = JSON.parse(savedData);
                selectedAvatar = data.avatar;
                applyUserData(data.username, data.bio, data.avatar);
                
                document.getElementById('reg-window').style.display = 'none';
                document.getElementById('main-window').style.display = 'block';
                document.getElementById('profile-widget').style.display = 'flex';
            }
        };
    </script>
