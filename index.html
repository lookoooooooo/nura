<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NURA</title>
  <style>
    body {
      background-color: #f4ebe1; 
      background-image: radial-gradient(#e3d5ca 2px, transparent 2px);
      background-size: 16px 16px;
      color: #6b5b52;
      font-family: 'MS Gothic', 'Courier New', monospace;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      position: relative;
    }

    .user-profile-trigger {
      position: absolute;
      top: 20px;
      right: 20px;
      background: #fffdf9;
      border: 2px solid #cb997e;
      box-shadow: 3px 3px 0px #ddbea9;
      padding: 8px;
      cursor: pointer;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      z-index: 200;
    }
    .user-profile-trigger:hover {
      background: #f4ebe1;
      border-color: #a3b18a;
    }

    .profile-modal {
      position: absolute;
      top: 75px;
      right: 20px;
      width: 320px;
      background: #fffdf9;
      border: 3px double #b7b7a4;
      padding: 20px;
      box-sizing: border-box;
      box-shadow: 5px 5px 0px #ddbea9;
      z-index: 200;
      border-radius: 4px;
    }

    .modal-close {
      position: absolute;
      top: 5px;
      right: 10px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }

    .avatar-selection-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 5px;
      max-height: 110px;
      overflow-y: auto;
      border: 1px dashed #b7b7a4;
      padding: 8px;
      background: #fcfaf2;
      margin-top: 5px;
    }
    .avatar-option {
      font-size: 20px;
      text-align: center;
      cursor: pointer;
      padding: 3px;
    }
    .avatar-option:hover {
      background: #ffe3e0;
    }

    .main-frame {
      width: 100%;
      max-width: 440px;
      background: #fffdf9;
      border: 4px double #b7b7a4; 
      padding: 25px;
      box-sizing: border-box;
      border-radius: 4px;
      box-shadow: 6px 6px 0px #ddbea9;
      position: relative;
    }
    
    .brand-logo {
      text-align: center;
      font-size: 34px;
      font-weight: bold;
      letter-spacing: 4px;
      margin-bottom: 25px;
      color: #a3b18a; 
      text-shadow: 0 0 4px #fff, 0 0 8px #a3b18a, 0 0 15px #cbd5e1;
      animation: float 3s infinite ease-in-out;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }

    .search-container {
      position: relative;
      margin-bottom: 25px;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: #fcfaf2;
      border: 2px solid #cb997e;
      padding: 6px 10px;
    }
    .search-box:focus-within {
      border-color: #a3b18a;
      box-shadow: 0 0 8px rgba(163, 177, 138, 0.5);
    }
    .search-icon {
      margin-right: 8px;
      font-size: 14px;
      filter: sepia(0.5);
    }
    #search-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #6b5b52;
      font-family: inherit;
      font-size: 13px;
      outline: none;
    }
    #search-input::placeholder {
      color: #b7b7a4;
    }

    #search-btn {
      background: #cb997e;
      border: 1px solid #a5a58d;
      color: #fff;
      font-size: 11px;
      font-weight: bold;
      padding: 4px 12px;
      cursor: pointer;
      box-shadow: 2px 2px 0px #6b5b52;
      transition: 0.1s;
    }
    #search-btn:hover {
      background: #a3b18a;
      box-shadow: 1px 1px 0px #6b5b52;
      transform: translate(1px, 1px);
    }

    .suggestions-menu {
      position: absolute;
      top: 42px;
      left: 0;
      width: 100%;
      background: #fffdf9;
      border: 2px solid #cb997e;
      box-shadow: 4px 4px 0px #ddbea9;
      z-index: 100;
      box-sizing: border-box;
    }
    .suggest-item {
      padding: 8px 12px;
      cursor: pointer;
      font-size: 12px;
      color: #6b5b52;
      border-bottom: 1px dashed #e3d5ca;
    }
    .suggest-item:hover {
      background: #f4ebe1;
      color: #a3b18a;
    }
    
    .cyber-gate {
      text-align: center;
      border: 2px dashed #a3b18a;
      padding: 20px;
      background: #f7f9f4; 
    }
    .gate-title {
      color: #6b5b52;
      font-weight: bold;
      font-size: 13px;
      letter-spacing: 1px;
      margin-bottom: 15px;
    }
    
    .field-wrap {
      display: flex;
      align-items: center;
      background: #ffffff;
      border: 1px solid #b7b7a4;
      margin-top: 8px;
      padding: 6px 10px;
    }
    .field-wrap:focus-within {
      border-color: #cb997e;
    }
    .prefix {
      color: #a3b18a;
      font-size: 11px;
      font-weight: bold;
      margin-right: 6px;
    }
    .field-wrap input, .field-wrap textarea {
      width: 100%;
      background: transparent;
      border: none;
      color: #6b5b52;
      font-family: inherit;
      outline: none;
      font-size: 12px;
    }
    .field-wrap textarea {
      resize: none;
      height: 40px;
    }
    #bday {
      color-scheme: light;
    }

    #reg-go, #save-profile-btn {
      background: #ffe3e0;
      border: 2px solid #ffb3a7;
      color: #ff758f;
      padding: 10px;
      width: 100%;
      margin-top: 15px;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
      font-family: inherit;
      box-shadow: 3px 3px 0px #ffb3a7;
      transition: 0.1s;
    }
    #reg-go:hover, #save-profile-btn:hover {
      background: #ffb3a7;
      color: #fff;
    }
    #reg-go:active, #save-profile-btn:active {
      transform: translate(3px, 3px);
      box-shadow: none;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div id="profile-trigger" class="user-profile-trigger hidden">🐱</div>

  <div id="profile-card" class="profile-modal hidden">
    <div class="modal-close" id="profile-close">✖</div>
    <div class="gate-title">ヘ( ^o^)/ EDIT_PROFILE</div>
    
    <div class="field-wrap">
      <span class="prefix">NAME_</span>
      <input type="text" id="edit-nick">
    </div>

    <div class="field-wrap">
      <span class="prefix">BIO__</span>
      <textarea id="edit-bio" placeholder="Write status..."></textarea>
    </div>

    <div style="font-size:11px; margin-top:10px; font-weight:bold; color:#a3b18a;">CHOOSE_AVATAR:</div>
    <div class="avatar-selection-grid" id="avatar-grid"></div>

    <button id="save-profile-btn">[ SAVE CHANGES ]</button>
  </div>

  <div class="main-frame">
    <div class="brand-logo">*(o.o)* NURA ✧</div>

    <div class="search-container">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Search logs..." autocomplete="off">
        <button id="search-btn">GO</button>
      </div>
      <div id="suggestions" class="suggestions-menu hidden">
        <div class="suggest-item">✦ hatsune miku</div>
        <div class="suggest-item">✦ creepy story</div>
        <div class="suggest-item">✦ kaomoji</div>
        <div class="suggest-item">✦ cat</div>
      </div>
    </div>

    <div id="reg-form" class="cyber-gate">
      <div class="gate-title">ヘ( ^o^)/ STATE YOUR IDENTITY</div>
      <div class="field-wrap">
        <span class="prefix">NICK_</span>
        <input type="text" id="nick" placeholder="...">
      </div>
      <div class="field-wrap">
        <span class="prefix">PASS_</span>
        <input type="password" id="pass" placeholder="••••••••">
      </div>
      <div class="field-wrap">
        <span class="prefix">DATE_</span>
        <input type="date" id="bday">
      </div>
      <button id="reg-go">[ INITIALIZE LOGIN ]</button>
    </div>
  </div>
  <script>
    const sInp = document.getElementById('search-input');
    const sBtn = document.getElementById('search-btn');
    const sugMenu = document.getElementById('suggestions');
    const go = document.getElementById('reg-go');
    const nickInput = document.getElementById('nick');
    const regForm = document.getElementById('reg-form');
    const pTrigger = document.getElementById('profile-trigger');
    const pCard = document.getElementById('profile-card');
    const pClose = document.getElementById('profile-close');
    const editNick = document.getElementById('edit-nick');
    const editBio = document.getElementById('edit-bio');
    const avatarGrid = document.getElementById('avatar-grid');
    const saveProfileBtn = document.getElementById('save-profile-btn');

    let currentAvatar = localStorage.getItem('nura_avatar') || '📟';

    const emojis = [
      '🌟','🌙','🧸','🎮','🎧','📟','💿','⚡','🌸','🍦','🍓','🍭','💊','🍧','🎀','🛸','🧪','👾',
      '💎','🔮','🧿','🎐','🎈','🍟','🍩','🍿','🍮','🍡','🧋','🛼','🛹','🎟️','🛍️','💌','💤','✨',
      '🍀','🪐','🎨','🎬','🧩','🎉','🕯️','🔑','🗝️','📦','📊','📝','📌','📍','📎','👁️‍🗨️','🖤','🤍',
      '🤎','💜','💙','💚','💛','🧡','❤️','💖','💝','💟','💌','💤','💢','💣','💥','💦','💨','💫'
    ];

    if (localStorage.getItem('nura_username')) {
      regForm.classList.add('hidden');
      pTrigger.classList.remove('hidden');
      pTrigger.textContent = currentAvatar;
    }

    const globalBannedRegex = /хуй|хуе|хуи|пизд|ебан|ебат|уеб|бля|сук|залуп|мудак|шлюх|нах|член|fuc?k|bitch|shit|ass|cock|dick|cunt|pussy|whore|bastard|nigga|idiot|stupid|baka|クソ|バカ|アホ|チンポ|マンコ/vi;
    function clean(text) { return text.replace(globalBannedRegex, '***'); }

    if (nickInput) {
      nickInput.addEventListener('input', () => nickInput.value = clean(nickInput.value));
    }
    editNick.addEventListener('input', () => editNick.value = clean(editNick.value));
    editBio.addEventListener('input', () => editBio.value = clean(editBio.value));

    sInp.addEventListener('focus', () => {
      sugMenu.classList.remove('hidden');
    });

    document.addEventListener('click', (e) => {
      if (!sInp.contains(e.target) && !sugMenu.contains(e.target)) {
        sugMenu.classList.add('hidden');
      }
    });

    document.querySelectorAll('.suggest-item').forEach(item => {
      item.addEventListener('click', () => {
        sInp.value = item.textContent.replace('✦ ', '');
        sugMenu.classList.add('hidden');
      });
    });

    function doSearch() {
      const q = sInp.value.trim().toLowerCase();
      if (q) {
        window.location.href = `result.html?q=${encodeURIComponent(q)}`;
      }
    }

    sBtn.addEventListener('click', doSearch);
    sInp.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') doSearch();
    });

    go.addEventListener('click', () => {
      const name = nickInput.value.trim();
      const pass = document.getElementById('pass').value;
      const bday = document.getElementById('bday').value;
      if (!name || !pass || !bday) {
        alert('(X.X) Fill all fields, please! // すべての項目を入力してください！');
        return;
      }
      localStorage.setItem('nura_username', name);
      localStorage.setItem('nura_avatar', '📟');
      localStorage.setItem('nura_bio', '');
      
      pTrigger.textContent = '📟';
      regForm.classList.add('hidden');
      pTrigger.classList.remove('hidden');
      alert('✧ Saved! Welcome to NURA ✧ // 保存されました！NURAへようこそ ✧');
    });

    pTrigger.addEventListener('click', () => {
      editNick.value = localStorage.getItem('nura_username') || '';
      editBio.value = localStorage.getItem('nura_bio') || '';
      pCard.classList.remove('hidden');
    });

    pClose.addEventListener('click', () => pCard.classList.add('hidden'));

    emojis.forEach(emoji => {
      const span = document.createElement('span');
      span.className = 'avatar-option';
      span.textContent = emoji;
      span.addEventListener('click', () => {
        currentAvatar = emoji;
        alert(`Avatar selected: ${emoji} // アバターが選択されました: ${emoji}`);
      });
      avatarGrid.appendChild(span);
    });

    saveProfileBtn.addEventListener('click', () => {
      const updatedName = editNick.value.trim();
      const updatedBio = editBio.value.trim();

      if (!updatedName) {
        alert('(X.X) Name cannot be empty! // 名前を入力してください！');
        return;
      }

      localStorage.setItem('nura_username', updatedName);
      localStorage.setItem('nura_bio', updatedBio);
      localStorage.setItem('nura_avatar', currentAvatar);
      
      pTrigger.textContent = currentAvatar;
      pCard.classList.add('hidden');
      alert('✧ Profile Updated! ✧ // プロフィールが更新されました！ ✧');
    });
  </script>
</body>
</html>
