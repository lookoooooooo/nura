<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NURA - Start</title>
  <style>
    body {
      background: #050505;
      color: #fff;
      font-family: 'Courier New', monospace;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .main-frame {
      width: 100%;
      max-width: 440px;
      background: #0a0a0a;
      border: 1px solid #1a1a1a;
      padding: 30px;
      box-sizing: border-box;
      border-radius: 8px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
    }
    
    /* ТЕКСТОВЫЙ ЛОГОТИП С КРУТЫМ СВЕЧЕНИЕМ */
    .brand-logo {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      letter-spacing: 6px;
      margin-bottom: 25px;
      color: #00f0ff;
      /* Многослойное неоновое свечение */
      text-shadow: 0 0 5px #00f0ff, 0 0 10px #00f0ff, 0 0 20px #00a8b5;
    }

    .search-container {
      position: relative;
      margin-bottom: 25px;
    }
    .search-box {
      display: flex;
      align-items: center;
      background: #111;
      border: 1px solid #222;
      padding: 5px 10px;
      border-radius: 4px;
      /* Голубое свечение для поиска */
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.1);
      transition: box-shadow 0.3s ease;
    }
    .search-box:focus-within {
      border-color: #00f0ff;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
    }
    .search-icon {
      margin-right: 8px;
    }
    #search-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-family: inherit;
      outline: none;
    }
    #search-btn {
      background: #00f0ff;
      border: none;
      color: #000;
      font-weight: bold;
      padding: 4px 10px;
      cursor: pointer;
      box-shadow: 0 0 8px #00f0ff;
      transition: 0.2s;
    }
    #search-btn:hover {
      background: #fff;
      box-shadow: 0 0 15px #fff;
    }
    .suggestions-menu {
      position: absolute;
      top: 40px;
      left: 0;
      width: 100%;
      background: #0d0d0d;
      border: 1px solid #00f0ff;
      box-shadow: 0 5px 15px rgba(0,240,255,0.3);
      z-index: 100;
      border-radius: 4px;
      box-sizing: border-box;
    }
    .suggest-item {
      padding: 10px;
      cursor: pointer;
      font-size: 13px;
      border-bottom: 1px solid #222;
    }
    .suggest-item:hover {
      background: #15222e;
      color: #00f0ff;
    }
    
    /* ИСПРАВЛЕННЫЙ БЛОК РЕГИСТРАЦИИ (БЕЗ МЕРЗКОГО ЦВЕТА) */
    .cyber-gate {
      text-align: center;
      border: 1px solid #ff0055;
      padding: 20px;
      background: #000000; /* Чистый глубокий черный вместо бордового */
      box-shadow: 0 0 15px rgba(255, 0, 85, 0.15); /* Мягкое внешнее свечение формы */
    }
    
    /* РОЗОВОЕ НЕОНОВОЕ СВЕЧЕНИЕ ДЛЯ АЛЕРТА */
    .gate-title {
      color: #ff0055;
      font-weight: bold;
      font-size: 18px;
      letter-spacing: 2px;
      margin-bottom: 15px;
      text-shadow: 0 0 5px #ff0055, 0 0 12px #ff0055;
    }
    
    .field-wrap {
      display: flex;
      align-items: center;
      background: #111;
      border: 1px solid #222;
      margin-top: 10px;
      padding: 5px 10px;
      transition: 0.2s;
    }
    .field-wrap:focus-within {
      border-color: #ff0055;
      box-shadow: 0 0 8px rgba(255, 0, 85, 0.3);
    }
    .prefix {
      color: #ff0055;
      font-size: 11px;
      margin-right: 8px;
    }
    .field-wrap input {
      width: 100%;
      background: transparent;
      border: none;
      color: #fff;
      font-family: inherit;
      outline: none;
    }
    #bday {
      color-scheme: dark;
    }
    #reg-go {
      background: #ff0055;
      border: none;
      color: #fff;
      padding: 10px;
      width: 100%;
      margin-top: 15px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 0 10px #ff0055;
      transition: 0.2s;
    }
    #reg-go:hover {
      background: #fff;
      color: #000;
      box-shadow: 0 0 18px #fff;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="main-frame">
    <!-- ЛОГОТИП СИСТЕМЫ -->
    <!-- Если захочешь картинку, раскомментируй строку ниже и вставь путь вместо logo.png -->
    <!-- <div style="text-align:center; margin-bottom:15px;"><img src="logo.png" alt="Logo" style="max-width:120px; filter: drop-shadow(0 0 8px #00f0ff);"></div> -->
    <div class="brand-logo">NURA</div>

    <!-- ПОИСКОВАЯ СТРОКА С ПОДСКАЗКАМИ -->
    <div class="search-container">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="Search the internet..." autocomplete="off">
        <button id="search-btn">GO</button>
      </div>
      <div id="suggestions" class="suggestions-menu hidden">
        <div class="suggest-item">hatsune miku</div>
        <div class="suggest-item">creepy story</div>
        <div class="suggest-item">kaomoji</div>
        <div class="suggest-item">cat</div>
      </div>
    </div>

    <!-- РЕГИСТРАЦИЯ -->
    <div id="reg-form" class="cyber-gate">
      <div class="gate-title">ACCESS DENIED</div>
      <div class="field-wrap">
        <span class="prefix">> CODENAME:</span>
        <input type="text" id="nick" placeholder="Enter nickname...">
      </div>
      <div class="field-wrap">
        <span class="prefix">> PASSWORD:</span>
        <input type="password" id="pass" placeholder="••••••••">
      </div>
      <div class="field-wrap">
        <span class="prefix">> BIRTHDAY:</span>
        <input type="date" id="bday">
      </div>
      <button id="reg-go">INITIALIZE LOGIN</button>
    </div>
  </div>

  <script>
    const sInp = document.getElementById('search-input');
    const sBtn = document.getElementById('search-btn');
    const sugMenu = document.getElementById('suggestions');
    const go = document.getElementById('reg-go');
    const nickInput = document.getElementById('nick');

    const globalBannedRegex = /хуй|хуе|хуи|пизд|ебан|ебат|уеб|бля|сук|залуп|мудак|шлюх|нах|член|fuc?k|bitch|shit|ass|cock|dick|cunt|pussy|whore|bastard|nigga|idiot|stupid|baka|クソ|バカ|アホ|チンポ|マンコ/vi;
    function clean(text) { return text.replace(globalBannedRegex, '***'); }

    if (nickInput) {
      nickInput.addEventListener('input', () => nickInput.value = clean(nickInput.value));
    }

    sInp.addEventListener('focus', () => {
      sugMenu.classList.remove('hidden');
    });

    document.addEventListener('click', (e) => {
      if (!sInp.contains(e.target) && !sugMenu.contains(e.target)) {
        sugMenu.classList.add('hidden');
      }
    });

    document.querySelectorAll('.suggest-item').forEach(item => {
      item.addEventListener('click', () => {
        sInp.value = item.textContent;
        sugMenu.classList.add('hidden');
      });
    });

    function doSearch() {
      const q = sInp.value.trim().toLowerCase();
      if (q) {
        window.location.href = `result.html?q=${encodeURIComponent(q)}`;
      }
    }

    sBtn.addEventListener('click', doSearch);
    sInp.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') doSearch();
    });

    go.addEventListener('click', () => {
      const name = nickInput.value.trim();
      const pass = document.getElementById('pass').value;
      const bday = document.getElementById('bday').value;
      if (!name || !pass || !bday) {
        alert('Fill all fields!');
        return;
      }
      localStorage.setItem('nura_username', name);
      alert('Identity Saved!');
      document.getElementById('reg-form').classList.add('hidden');
    });
  </script>
</body>
</html>
