<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NURA</title>
</head>
<body>

  <!-- Главный контейнер-рамка -->
  <div class="main-frame">
    
    <!-- СВЕТЯЩИЙСЯ ЛОГОТИП -->
    <h1 id="logo">NURA</h1>
    <div class="sub">An internet with a twist.</div>

    <!-- ОКНО РЕГИСТРАЦИИ -->
    <div id="reg-form">
      <h2>JOIN NURA</h2>
      <input type="text" id="nick" placeholder="Username">
      <button id="reg-go">SIGN UP</button>
    </div>

    <!-- ВИДЖЕТ АККАУНТА (СКРЫТ) -->
    <div id="user-hub" class="hidden">
      <button id="hub-trigger">🍓</button>
      
      <!-- ВЫПАДАЮЩЕЕ МЕНЮ -->
      <div id="drop-menu" class="hidden">
        <h4 id="user-title">User</h4>
        <input type="text" id="change-name">
        
        <!-- СЕТКА ЭМОДЗИ -->
        <div class="emoji-grid">
          <span class="em">🍓</span><span class="em">💞</span>
          <span class="em">🍮</span><span class="em">🎱</span>
          <span class="em">🍀</span><span class="em">🌺</span>
          <span class="em">🌸</span><span class="em">🪻</span>
          <span class="em">🍁</span><span class="em">🍄</span>
          <span class="em">🪺</span><span class="em">🌷</span>
          <span class="em">☔️</span><span class="em">🌨️</span>
          <span class="em">🫧</span><span class="em">🍙</span>
          <span class="em">🧃</span><span class="em">🍡</span>
          <span class="em">🍧</span><span class="em">🍥</span>
          <span class="em">🍣</span><span class="em">🎸</span>
          <span class="em">👾</span><span class="em">🌀</span>
        </div>

        <select id="bit">
          <option>Standard Bit</option>
          <option>Synthwave Bass</option>
        </select>
        <button id="exit">LOGOUT</button>
      </div>
    </div>

  </div>


  <script>
    const go = document.getElementById('reg-go');
    const trig = document.getElementById('hub-trigger');
    const menu = document.getElementById('drop-menu');
    const exit = document.getElementById('exit');

    // Клик по аватару
    trig.addEventListener('click', (e) => {
      e.stopPropagation();
      menu.classList.toggle('hidden');
    });

  
    go.addEventListener('click', () => {
      const name = document.getElementById('nick').value;
      if(!name) return;
      document.getElementById('reg-form').classList.add('hidden');
      document.getElementById('user-hub').classList.remove('hidden');
      document.getElementById('user-title').textContent = name;
    });

   
    exit.addEventListener('click', () => {
      document.getElementById('reg-form').classList.remove('hidden');
      document.getElementById('user-hub').classList.add('hidden');
      menu.classList.add('hidden');
    });

 
    document.addEventListener('click', () => menu.classList.add('hidden'));
    menu.addEventListener('click', (e) => e.stopPropagation());

   
    document.querySelectorAll('.em').forEach(el => {
      el.addEventListener('click', () => {
        trig.textContent = el.textContent;
      });
    });
  </script>
</body>
</html>
<style>
body {
  background: #050505;
  color: #fff;
  font-family: monospace;
  margin: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}

.main-frame {
  position: relative;
  width: 100%;
  max-width: 440px;
  background: #0a0a0a;
  border: 2px solid #333;
  padding: 30px;
  box-sizing: border-box;
}

#logo {
  color: #00f0ff;
  font-size: 3rem;
  text-align: center;
  margin: 0;
  text-shadow: 
    0 0 5px #00f0ff,
    0 0 15px #00d8ff;
}

.sub {
  font-size: 12px;
  color: #666;
  text-align: center;
  margin-bottom: 20px;
}

#reg-form {
  text-align: center;
}

#reg-form h2 {
  color: #ff0055;
}

#nick {
  width: 100%;
  background: #111;
  border: 1px solid #333;
  color: #fff;
  padding: 10px;
  margin-bottom: 10px;
  box-sizing: border-box;
}

#reg-go {
  background: #ff0055;
  border: none;
  color: #fff;
  padding: 10px;
  width: 100%;
  cursor: pointer;
}

#user-hub {
  position: absolute;
  top: 15px;
  right: 15px;
}

#hub-trigger {
  background: #111;
  border: 2px solid #00f0ff;
  font-size: 20px;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  cursor: pointer;
}

#drop-menu {
  position: absolute;
  top: 50px;
  right: 0;
  background: #0d0d0d;
  border: 1px solid #00f0ff;
  padding: 15px;
  width: 240px;
}

#change-name, #bit, #exit {
  width: 100%;
  background: #111;
  border: 1px solid #333;
  color: #fff;
  padding: 6px;
  margin-bottom: 10px;
  box-sizing: border-box;
}

#exit {
  border-color: #ff0055;
  color: #ff0055;
  background: transparent;
  cursor: pointer;
}

.emoji-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 5px;
  margin-bottom: 10px;
  max-height: 100px;
  overflow-y: auto;
}

.em {
  font-size: 18px;
  cursor: pointer;
  text-align: center;
}

.hidden {
  display: none !important;
}
</style>
