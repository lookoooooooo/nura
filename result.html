<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NURA - Result</title>
  <style>
    body {
      background: #050505;
      color: #fff;
      font-family: 'Courier New', monospace;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .main-frame {
      width: 100%;
      max-width: 440px;
      background: #0a0a0a;
      border: 2px solid #333;
      padding: 30px;
      box-sizing: border-box;
      border-radius: 8px;
    }
    #logo {
      color: #00f0ff;
      font-size: 3rem;
      text-align: center;
      margin: 0;
      text-shadow: 0 0 5px #00f0ff, 0 0 15px #00d8ff;
    }
    .sub {
      font-size: 12px;
      color: #666;
      text-align: center;
      margin-bottom: 20px;
    }
    /* Виджет аккаунта ЖЕСТКО В УГЛУ ЭКРАНА */
    #user-hub {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 9999;
    }
    #hub-trigger {
      background: #111;
      border: 2px solid #00f0ff;
      font-size: 22px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      cursor: pointer;
    }
    #drop-menu {
      position: absolute;
      top: 55px;
      right: 0;
      background: #0d0d0d;
      border: 1px solid #00f0ff;
      padding: 15px;
      width: 250px;
      border-radius: 4px;
    }
    .setting-group {
      margin-bottom: 12px;
    }
    .setting-group label {
      display: block;
      font-size: 10px;
      color: #555;
      margin-bottom: 4px;
    }
    #change-name, #user-bio, #exit {
      width: 100%;
      background: #111;
      border: 1px solid #333;
      color: #fff;
      padding: 8px;
      box-sizing: border-box;
      font-family: inherit;
    }
    #user-bio {
      height: 60px;
      resize: none;
    }
    /* Компактная сетка эмодзи */
    .emoji-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 6px;
      max-height: 90px;
      overflow-y: auto;
      border: 1px solid #222;
      padding: 5px;
    }
    .em {
      font-size: 18px;
      cursor: pointer;
      text-align: center;
    }
    .em:hover {
      background: #15222e;
    }
    /* Окно результатов поиска */
    #nura-search-result {
      background: #0d0d0d;
      border: 1px solid #00f0ff;
      padding: 15px;
      margin-top: 20px;
    }
    #nura-search-result h3 {
      margin: 0 0 8px 0;
      color: #00f0ff;
    }
    .search-res-btns {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
    .translate-btn, .back-btn {
      background: transparent;
      border: 1px solid #00f0ff;
      color: #00f0ff;
      padding: 6px 12px;
      cursor: pointer;
      font-family: inherit;
    }
    .translate-btn:hover {
      background: #00f0ff;
      color: #000;
    }
    .back-btn {
      border-color: #ff0055;
      color: #ff0055;
    }
    .back-btn:hover {
      background: #ff0055;
      color: #fff;
    }
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="main-frame">
    <h1 id="logo">NURA</h1>
    <div class="sub">An internet with a twist.</div>

    <!-- ОКНО РЕЗУЛЬТАТА ПОИСКА -->
    <div id="nura-search-result">
      <h3 id="res-title">Searching...</h3>
      <p id="res-text-content">Loading database block...</p>
      <div class="search-res-btns">
        <button class="translate-btn" id="trans-btn">Translate to Japanese</button>
        <button class="back-btn" onclick="window.location.href='index.html'">BACK</button>
      </div>
    </div>

    <!-- ВИДЖЕТ АККАУНТА (ЖЕСТКО В УГЛУ ЭКРАНА) -->
    <div id="user-hub">
      <button id="hub-trigger">🍓</button>
      <div id="drop-menu" class="hidden">
        <h4 id="user-title">User Profile</h4>
        
        <div class="setting-group">
          <label>Change Name:</label>
          <input type="text" id="change-name" value="User">
        </div>
        
        <div class="setting-group">
          <label>Status / Bio:</label>
          <textarea id="user-bio" placeholder="Tell about yourself..."></textarea>
        </div>
        
        <div class="setting-group">
          <label>Choose Avatar:</label>
          <div class="emoji-grid">
            <span class="em">🎯</span><span class="em">🎨</span>
            <span class="em">🎆</span><span class="em">⏰</span>
            <span class="em">💎</span><span class="em">🎀</span>
            <span class="em">🩰</span><span class="em">🎼</span>
            <span class="em">🎧</span><span class="em">🛸</span>
            <span class="em">🕶️</span><span class="em">📟</span>
            <span class="em">🪐</span><span class="em">🎮</span>
            <span class="em">🕯️</span><span class="em">🗝️</span>
            <span class="em">💽</span><span class="em">💿</span>
            <span class="em">🌌</span><span class="em">🔮</span>
            <span class="em">📽️</span><span class="em">📼</span>
            <span class="em">📻</span><span class="em">☎️</span>
            <span class="em">🏮</span><span class="em">🎐</span>
            <span class="em">⛩️</span><span class="em">🗼</span>
            <span class="em">🐈‍⬛</span><span class="em">🦊</span>
            <span class="em">🐰</span><span class="em">🐼</span>
            <span class="em">🐾</span><span class="em">🕊️</span>
            <span class="em">🦋</span><span class="em">🪐</span>
            <span class="em">⭐</span><span class="em">🌟</span>
            <span class="em">🌙</span><span class="em">⚡</span>
            <span class="em">✨</span><span class="em">🎈</span>
            <span class="em">🧸</span><span class="em">🔑</span>
            <span class="em">🍓</span><span class="em">💞</span>
            <span class="em">🍮</span><span class="em">🎱</span>
            <span class="em">🍀</span><span class="em">🌺</span>
            <span class="em">🌸</span><span class="em">🪻</span>
            <span class="em">🍁</span><span class="em">🍄</span>
            <span class="em">🪺</span><span class="em">🌷</span>
            <span class="em">☔️</span><span class="em">🌨️</span>
            <span class="em">🫧</span><span class="em">🍙</span>
            <span class="em">🧃</span><span class="em">🍡</span>
            <span class="em">🍧</span><span class="em">🍥</span>
            <span class="em">🍣</span><span class="em">🎸</span>
            <span class="em">👾</span><span class="em">🌀</span>
          </div>
        </div>
        <button id="exit" onclick="localStorage.removeItem('nura_username'); window.location.href='index.html'">LOGOUT</button>
      </div>
    </div>
  </div>

  <script>
    // Локальная база ответов
    const nuraDatabase = {
      cats: {
        keywords: ['кят', 'кятс', 'китти', 'кот', 'коты', 'кошка', 'кошки', 'cat', 'cats', 'kitty', 'ねこ', 'ネコ', '猫', 'neko'],
        title: '🐱 CATS DATA-BLOCK',
        en: 'Cats are small, carnivorous mammals with soft fur, triangular ears, sharp claws, and long tails. They are known for their agility and independent nature.',
        ja: '猫（ネコ）は、柔らかい毛並み、三角形の耳、鋭い爪、長い尻尾を持つ小型の肉食哺乳類です。その俊敏性と独立した性格で知られています。'
      },
      miku: {
        keywords: ['хацуне мику', 'мику', 'miku', 'hatsune miku', '初音ミク'],
        title: '🎤 HATSUNE MIKU DATA',
        en: 'Hatsune Miku is a Japanese virtual pop star developed by Crypton Future Media, singing via Vocaloid software and performing as a 3D hologram.',
        ja: '初音ミク（ハツネミク）は、クリプトン・フューチャー・メディアが開発した、音声合成ソフト（ボーカロイド）で歌う日本のバーチャルポップスターです。'
      },
      story: {
        keywords: ['жуткая история', 'creepy story', 'horror', 'scary'],
        title: '👁️ CREEPY DATA-BLOCK',
        en: 'You hear a whisper from the corner of your dark room: "System online". But your computer has been unplugged for hours.',
        ja: '暗い部屋の隅から囁き声が聞こえる：「システムオンライン」。しかし、パソコンの電源プラグは数時間前から抜かれたままだ。'
      },
      kaomoji: {
        keywords: ['каоэмодзи', 'kaomoji', '顔文字'],
        title: '⸜( *ˊᵕˋ* )⸝ KAOMOJI LIST',
        en: 'Japanese text emoticons used to express emotions in texting. Examples: (づ ◕‿◕ )づ , (＠_＠) , ᕦ( ͡° ͜ʖ ͡°)ᕤ.',
        ja: 'テキストで感情を表現するために使われる日本の文字ベースのエモティコン（顔文字）です。例：(づ ◕‿◕ )づ , (＠_＠).'
      }
    };

    // Фильтр мата на русском, английском и японском
    const globalBannedRegex = /хуй|хуе|хуи|пизд|ебан|ебат|уеб|бля|сук|залуп|мудак|шлюх|нах|член|fuc?k|bitch|shit|ass|cock|dick|cunt|pussy|whore|bastard|nigga|idiot|stupid|baka|クソ|バカ|アホ|チンポ|マンコ/vi;
    function clean(text) { return text.replace(globalBannedRegex, '***'); }

    // Подгрузка имени из памяти
    const savedName = localStorage.getItem('nura_username') || 'User';
    const uTitle = document.getElementById('user-title');
    const cName = document.getElementById('change-name');
    uTitle.textContent = savedName;
    cName.value = savedName;

    // Вешаем фильтр на поля ввода
    const bio = document.getElementById('user-bio');
    bio.addEventListener('input', () => bio.value = clean(bio.value));
    cName.addEventListener('input', () => {
      cName.value = clean(cName.value);
      uTitle.textContent = cName.value || 'User';
      localStorage.setItem('nura_username', cName.value);
    });

    // Извлечение поискового запроса из адресной строки
    const urlParams = new URLSearchParams(window.location.search);
    const query = urlParams.get('q');
    const resTitle = document.getElementById('res-title');
    const resText = document.getElementById('res-text-content');
    const tBtn = document.getElementById('trans-btn');

    let currentData = null;
    let isEn = true;

    if (query) {
      for (let key in nuraDatabase) {
        if (nuraDatabase[key].keywords.includes(query.toLowerCase())) {
          currentData = nuraDatabase[key];
          break;
        }
      }
    }

    // Вывод текста или редирект в Google
    if (currentData) {
      resTitle.textContent = currentData.title;
      resText.textContent = currentData.en;
      
      tBtn.addEventListener('click', () => {
        if (isEn) {
          resText.textContent = currentData.ja;
          tBtn.textContent = 'Translate to English';
          isEn = false;
        } else {
          resText.textContent = currentData.en;
          tBtn.textContent = 'Translate to Japanese';
          isEn = true;
        }
      });
    } else {
      window.location.href = `https://google.com{encodeURIComponent(query)}`;
    }

    // Логика выпадающего меню аккаунта
    const trig = document.getElementById('hub-trigger');
    const menu = document.getElementById('drop-menu');
    trig.addEventListener('click', (e) => {
      e.stopPropagation();
      menu.classList.toggle('hidden');
    });
    document.addEventListener('click', () => menu.classList.add('hidden'));
    menu.addEventListener('click', (e) => e.stopPropagation());
    document.querySelectorAll('.em').forEach(el => {
      el.addEventListener('click', () => trig.textContent = el.textContent);
    });
  </script>
</body>
</html>
