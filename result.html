<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NURA - Database Logs</title>
  <style>
    body {
      background-color: #f4ebe1; 
      background-image: radial-gradient(#e3d5ca 2px, transparent 2px);
      background-size: 16px 16px;
      color: #6b5b52;
      font-family: 'MS Gothic', 'Courier New', monospace;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .nav-header {
      width: 100%;
      max-width: 600px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .back-home {
      color: #cb997e;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }
    .back-home:hover {
      color: #a3b18a;
    }

    .user-badge {
      font-size: 12px;
      background: #fffdf9;
      border: 1px solid #b7b7a4;
      padding: 6px 12px;
      border-radius: 2px;
      text-align: right;
    }
    .user-bio-text {
      font-size: 10px;
      color: #a3b18a;
      margin-top: 2px;
    }

    .avatar-vault-box {
      width: 100%;
      max-width: 600px;
      background: #fffdf9;
      border: 2px dashed #cb997e;
      padding: 15px;
      margin-bottom: 20px;
      box-sizing: border-box;
    }
    .vault-title {
      font-size: 12px;
      font-weight: bold;
      color: #cb997e;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }
    .avatar-selection-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 6px;
      padding: 5px;
      background: #fcfaf2;
    }
    .avatar-option {
      font-size: 22px;
      text-align: center;
      cursor: pointer;
      user-select: none;
    }
    .avatar-option:hover {
      background: #ffe3e0;
      transform: scale(1.1);
    }

    .results-frame {
      width: 100%;
      max-width: 600px;
      background: #fffdf9;
      border: 4px double #b7b7a4; 
      padding: 25px;
      box-sizing: border-box;
      border-radius: 4px;
      box-shadow: 6px 6px 0px #ddbea9;
    }

    .query-header {
      font-size: 16px;
      border-bottom: 2px dashed #cb997e;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }

    .query-text {
      color: #a3b18a;
      font-weight: bold;
    }

    .log-item {
      background: #f7f9f4;
      border: 1px solid #b7b7a4;
      padding: 15px;
      margin-bottom: 15px;
    }
    .log-item:hover {
      border-color: #cb997e;
      background: #fffdf9;
    }

    .log-title {
      font-size: 14px;
      font-weight: bold;
      color: #cb997e;
      text-decoration: none;
      display: block;
      margin-bottom: 5px;
    }
    .log-title:hover {
      text-decoration: underline;
    }

    .log-meta {
      font-size: 11px;
      color: #a3b18a;
      margin-bottom: 8px;
    }

    .log-snippet {
      font-size: 12px;
      line-height: 1.4;
    }

    .no-results {
      text-align: center;
      padding: 40px 0;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="nav-header">
    <a href="index.html" class="back-home">◀ RETURN TO NURA</a>
    <div class="user-badge">
      <div id="user-display">GUEST_MODE</div>
      <div id="user-bio-display" class="user-bio-text"></div>
    </div>
  </div>

  <div class="avatar-vault-box">
    <div class="vault-title">✦ NURA_AVATAR_VAULT (CLICK TO CHANGE) ✦</div>
    <div class="avatar-selection-grid" id="avatar-grid"></div>
  </div>

  <div class="results-frame">
    <div class="query-header">
      SEARCH_LOG // TARGET: <span id="target-query" class="query-text">None</span>
    </div>

    <div id="results-container"></div>
  </div>

  <script>
    const emojis = [
      '🌟','🌙','🧸','🎮','🎧','📟','💿','⚡','🌸','🍦','🍓','🍭','💊','🍧','🎀','🛸','🧪','👾',
      '💎','🔮','🧿','🎐','🎈','🍟','🍩','🍿','🍮','🍡','🧋','🛼','🛹','🎟️','🛍️','💌','💤','✨',
      '🍀','🪐','🎨','🎬','🧩','🎉','🕯️','🔑','🗝️','📦','📊','📝','📌','📍','📎','👁️‍🗨️','🖤','🤍',
      '🤎','💜','💙','💚','💛','🧡','❤️','💖','💝','💟','💌','💤','💢','💣','💥','💦','💨','💫'
    ];

    function renderUserBadge() {
      const username = localStorage.getItem('nura_username');
      const avatar = localStorage.getItem('nura_avatar') || '📟';
      const bio = localStorage.getItem('nura_bio') || '';
      
      if (username) {
        document.getElementById('user-display').textContent = `${avatar} OPERATOR: ${username.toUpperCase()}`;
        document.getElementById('user-bio-display').textContent = bio ? `STATUS: ${bio}` : '';
      }
    }
    renderUserBadge();

    const avatarGrid = document.getElementById('avatar-grid');
    emojis.forEach(emoji => {
      const span = document.createElement('span');
      span.className = 'avatar-option';
      span.textContent = emoji;
      span.addEventListener('click', () => {
        localStorage.setItem('nura_avatar', emoji);
        renderUserBadge();
      });
      avatarGrid.appendChild(span);
    });

    const urlParams = new URLSearchParams(window.location.search);
    const query = urlParams.get('q') ? urlParams.get('q').trim().toLowerCase() : '';
    document.getElementById('target-query').textContent = query ? `"${query}"` : 'ALL_LOGS';

    const container = document.getElementById('results-container');
    const globalBannedRegex = /хуй|хуе|хуи|пизд|ебан|ебат|уеб|бля|сук|залуп|мудак|шлюх|нах|член|fuc?k|bitch|shit|ass|cock|dick|cunt|pussy|whore|bastard|nigga|idiot|stupid|baka|クソ|バка|アホ|チンポ|マンコ/vi;
    function clean(text) { return text.replace(globalBannedRegex, '***'); }
    const cleanQuery = clean(query);

    fetch('database.json')
      .then(response => response.json())
      .then(mockDatabase => {
        const matchedResults = mockDatabase.filter(item => {
          if (!cleanQuery) return true;
          return item.tags.some(tag => tag.includes(cleanQuery)) || 
                 item.title.toLowerCase().includes(cleanQuery) || 
                 item.snippet.toLowerCase().includes(cleanQuery);
        });

        if (matchedResults.length === 0) {
          container.innerHTML = `
            <div class="no-results">
              (X._.X)<br><br>
              NO SYSTEM MATCHES FOUND FOR "${clean(query)}" // 該当するログが見つかりませんでした<br>
              TRY TARGETING CODES LIKE 'MIKU' OR 'CREEPY STORY'
            </div>`;
        } else {
          matchedResults.forEach(item => {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'log-item';
            
            let linkHref = "#";
            if (item.tags.some(tag => ['creepy story', 'horror', 'urban legend', 'scary', '怖い話', '都市伝説'].includes(tag))) {
              linkHref = "https://miniforce-fanon.fandom.com/wiki/WikiMINIFORCE:THEILLUSIONOFSALVATIONAU/Miniforce_Fanon_Wiki";
            }

            itemDiv.innerHTML = `
              <a href="${linkHref}" target="_blank" class="log-title">${clean(item.title)}</a>
              <div class="log-meta">${clean(item.meta)}</div>
              <div class="log-snippet">${clean(item.snippet)}</div>
            `;
            container.appendChild(itemDiv);
          });
        }
      })
      .catch(error => {
        container.innerHTML = `<div class="no-results">(X.X) DATABASE_ERROR // データベースエラー</div>`;
      });
  </script>
</body>
</html>
