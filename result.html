<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NURA - Database Logs</title>
  <style>
    body {
      background-color: #f4ebe1; 
      background-image: radial-gradient(#e3d5ca 2px, transparent 2px);
      background-size: 16px 16px;
      color: #6b5b52;
      font-family: 'MS Gothic', 'Courier New', monospace;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    .main-frame {
      width: 100%;
      max-width: 500px;
      background: #fffdf9;
      border: 4px double #b7b7a4; 
      padding: 25px;
      box-sizing: border-box;
      border-radius: 4px;
      box-shadow: 6px 6px 0px #ddbea9;
    }
    
    .header-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px dashed #e3d5ca;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    .brand-logo {
      font-size: 20px;
      font-weight: bold;
      color: #a3b18a; 
      text-decoration: none;
      text-shadow: 0 0 4px #fff, 0 0 8px #a3b18a;
    }

    .user-badge {
      font-size: 11px;
      background: #f7f9f4;
      padding: 4px 8px;
      border: 1px dashed #a3b18a;
      color: #a3b18a;
    }

    .search-info {
      font-size: 12px;
      margin-bottom: 20px;
      background: #fcfaf2;
      padding: 10px;
      border: 1px solid #cb997e;
    }

    .query-text {
      color: #ff758f;
      font-weight: bold;
    }

    .results-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .result-card {
      border: 1px solid #b7b7a4;
      padding: 15px;
      background: #fff;
      box-shadow: 3px 3px 0px #e3d5ca;
      transition: 0.2s;
    }

    .result-card:hover {
      border-color: #cb997e;
      box-shadow: 3px 3px 0px #cb997e;
      transform: translate(-1px, -1px);
    }

    .result-title {
      font-size: 14px;
      font-weight: bold;
      color: #cb997e;
      margin-bottom: 5px;
    }

    .result-snippet {
      font-size: 12px;
      line-height: 1.4;
      color: #6b5b52;
    }

    .back-btn {
      display: inline-block;
      margin-top: 25px;
      background: #ffe3e0;
      border: 2px solid #ffb3a7;
      color: #ff758f;
      padding: 8px 16px;
      cursor: pointer;
      font-weight: bold;
      font-size: 12px;
      text-decoration: none;
      box-shadow: 3px 3px 0px #ffb3a7;
    }

    .back-btn:hover {
      background: #ffb3a7;
      color: #fff;
    }

    .back-btn:active {
      transform: translate(3px, 3px);
      box-shadow: none;
    }

    .no-results {
      text-align: center;
      padding: 30px 10px;
      font-size: 13px;
      color: #b7b7a4;
    }
  </style>
</head>
<body>

  <div class="main-frame">
    <div class="header-area">
      <a href="index.html" class="brand-logo">*(o.o)* NURA</a>
      <div id="user-display" class="user-badge">GUEST</div>
    </div>

    <div class="search-info">
      ✧ LOG_SEARCH_REQUEST: <span id="search-target" class="query-text">None</span>
    </div>

    <div id="results-container" class="results-list"></div>

    <a href="index.html" class="back-btn">[ <-- GO BACK ]</a>
  </div>

  <script>
    const savedUser = localStorage.getItem('nura_username');
    if (savedUser) {
      document.getElementById('user-display').textContent = `USER: ${savedUser}`;
    }

    const urlParams = new URLSearchParams(window.location.search);
    const query = urlParams.get('q') ? urlParams.get('q').trim().toLowerCase() : '';
    
    document.getElementById('search-target').textContent = query ? `"${query}"` : 'empty_target';

    const database = [
      {
        keywords: ['hatsune miku', 'miku', 'vocaloid'],
        title: '✦ LOG_039: Project_Miku.txt',
        snippet: 'A digital voice echo found inside an old server grid dated 2007. It smells like leeks and glowing neon pixels. She is still singing...'
      },
      {
        keywords: ['creepy story', 'creepy', 'ghost', 'story'],
        title: '✦ LOG_666: The_Midnight_Modem.log',
        snippet: 'In 1999, a user connected to a strange terminal called NURA. After midnight, the text turned into moving eyes. The user never logged off.'
      },
      {
        keywords: ['kaomoji', 'emoticon', 'smile'],
        title: '✦ LOG_101: Ancient_Faces.dat',
        snippet: 'Collection of forgotten expressions: *(o.o)* ✧ ヘ( ^o^)/ ◌ (X.X) ✿ (｡♥‿♥｡) ◌ (𖦹_𖦹). They hold the raw emotion of the early internet era.'
      },
      {
        keywords: ['cat', 'neko', 'cats'],
        title: '✦ LOG_002: Neko_Cache.bin',
        snippet: 'Pixelated paws detected in the memory sector. A tiny spirit cat appears to be sleeping directly on top of your local storage data.'
      }
    ];

    const container = document.getElementById('results-container');

    const matchedResults = database.filter(item => {
      return item.keywords.some(keyword => query.includes(keyword) || keyword.includes(query));
    });

    if (query === '') {
      container.innerHTML = '<div class="no-results">(X.X)<br><br>No request specified.<br>Please return and type something!</div>';
    } else if (matchedResults.length > 0) {
      matchedResults.forEach(item => {
        const card = document.createElement('div');
        card.className = 'result-card';
        card.innerHTML = `
          <div class="result-title">${item.title}</div>
          <div class="result-snippet">${item.snippet}</div>
        `;
        container.appendChild(card);
      });
    } else {
      container.innerHTML = `
        <div class="result-card">
          <div class="result-title">✧ SYSTEM_ALERT: Signal_Lost.err</div>
          <div class="result-snippet">NURA searched the grid for "${query}" but found only empty noise. Maybe this memory belongs to a future that has not happened yet?</div>
        </div>
      `;
    }
  </script>
</body>
</html>
