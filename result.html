<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✧ nura - search results ✧</title>
    <style>
        @import url('https://googleapis.com');

        body {
            background-color: #1e351e; 
            background-image: radial-gradient(#152515 15%, transparent 16%);
            background-size: 16px 16px;
            font-family: 'Courier Prime', 'Courier', monospace;
            color: #1b1008;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .window {
            background: #f7e3af;
            border: 3px solid #6b1d1d;
            box-shadow: 6px 6px 0px #351010;
            max-width: 600px;
            width: 100%;
            margin-top: 40px;
            image-rendering: pixelated;
        }

        .window-header {
            background: #872525;
            color: #ffe6bd;
            padding: 8px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            border-bottom: 3px solid #6b1d1d;
        }

        .window-dots span {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #f7e3af;
            border: 2px solid #6b1d1d;
            margin-left: 4px;
            cursor: pointer;
        }

        .window-body {
            padding: 20px;
            line-height: 1.5;
        }

        h1 {
            font-size: 28px;
            margin-top: 0;
            margin-bottom: 5px;
            color: #6b1d1d;
        }

        .slogan {
            font-size: 16px;
            font-weight: bold;
            color: #4a341e;
            margin-bottom: 20px;
        }

        marquee {
            background: #2b3d2b;
            color: #e3ffd4;
            border: 2px solid #6b1d1d;
            padding: 5px;
            margin-bottom: 20px;
            font-size: 13px;
        }

        .search-results-area {
            background: #fffcf2;
            border: 3px solid #6b1d1d;
            padding: 15px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        .result-title {
            font-size: 18px;
            font-weight: bold;
            color: #872525;
            margin-bottom: 5px;
        }

        .result-url {
            font-size: 12px;
            color: #4a341e;
            margin-bottom: 12px;
            text-decoration: underline;
        }

        .article-layout {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            align-items: flex-start;
        }

        .article-text {
            font-size: 14px;
            color: #1b1008;
            line-height: 1.5;
        }

        .miku-image {
            width: 80px;
            height: 80px;
            object-fit: contain;
            image-rendering: pixelated;
            border: 2px dashed #6b1d1d;
            padding: 4px;
            background: #f7e3af;
        }

        .faq-container {
            margin-top: 20px;
        }

        .faq-item {
            border: 1px dashed #6b1d1d;
            margin-bottom: 8px;
            background: #f7e3af;
        }

        .faq-question {
            padding: 10px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            user-select: none;
            color: #872525;
            display: flex;
            justify-content: space-between;
        }

        .faq-question:hover {
            background: #f5d796;
        }

        .faq-answer {
            padding: 0 10px;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.2s ease-out, padding 0.2s ease-out;
            font-size: 13px;
            color: #1b1008;
            background: #fffcf2;
            line-height: 1.4;
        }

        .divider {
            border-top: 3px dashed #6b1d1d;
            margin: 40px 0;
        }

        .chat-section {
            background: #2b3d2b;
            border: 3px solid #6b1d1d;
            padding: 15px;
            color: #e3ffd4;
            margin-top: 20px;
        }

        .chat-layout {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .chat-avatar-container {
            animation: bounce 0.4s infinite alternate;
        }

        .miku-avatar {
            width: 50px;
            height: 50px;
            object-fit: contain;
            image-rendering: pixelated;
        }

        .chat-text-area {
            flex-grow: 1;
        }

        #miku-text {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .btn {
            display: inline-block;
            background: #f7b859;
            border: 2px solid #6b1d1d;
            padding: 8px 16px;
            color: #2b1100;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 3px 3px 0px #6b1d1d;
            cursor: pointer;
            font-size: 13px;
            text-align: center;
        }

        .btn:active {
            box-shadow: 0px 0px 0px #6b1d1d;
            transform: translate(3px, 3px);
        }

        .status-bar {
            border-top: 2px dashed #6b1d1d;
            margin-top: 20px;
            padding-top: 10px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            color: #4a341e;
        }

        #profile-widget {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #f7e3af;
            border: 3px solid #6b1d1d;
            box-shadow: 4px 4px 0px #351010;
            padding: 10px;
            display: none;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            z-index: 100;
        }

        #profile-widget:hover {
            background: #fffcf2;
        }

        #widget-avatar {
            font-size: 28px;
        }

        #widget-name {
            font-weight: bold;
            font-size: 13px;
            color: #6b1d1d;
        }

        #edit-window {
            max-width: 400px;
            position: fixed;
            top: 15vh;
            z-index: 101;
            display: none;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .input-text {
            width: 100%;
            padding: 8px;
            border: 3px solid #6b1d1d;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 14px;
            background: #fffcf2;
        }

        .avatar-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
            margin-top: 5px;
            background: #fffcf2;
            padding: 8px;
            border: 2px solid #6b1d1d;
        }

        .avatar-option {
            font-size: 24px;
            text-align: center;
            cursor: pointer;
            padding: 4px;
            border: 2px solid transparent;
        }

        .avatar-option:hover {
            background: #f7b859;
        }

        .avatar-option.selected {
            border-color: #6b1d1d;
            background: #872525;
        }

        @keyframes bounce { 
            from { transform: translateY(0); } 
            to { transform: translateY(-5px); } 
        }
    </style>
</head>
<body>

    <div id="profile-widget" onclick="openEdit()">
        <div id="widget-avatar">🍒</div>
        <div id="widget-name">Guest</div>
    </div>

    <div class="window">
        <div class="window-header">
            <span class="window-title">search_results.exe</span>
            <div class="window-dots"><span></span><span></span><span></span></div>
        </div>
        <div class="window-body">
            <marquee scrollamount="4">✦ 一癖あるインターネット ✦ search results system ✦ 一癖あるインターネット ✦</marquee>
            
            <h1>nura</h1>
            <div class="slogan">一癖あるインターネット</div>

            <div id="search-results" class="search-results-area"></div>
            
            <div style="margin-top: 25px;">
                <a href="index.html" class="btn">◁ Back to Index</a>
            </div>

            <div class="status-bar">
                <span>status: online</span>
                <span>hits: 000001</span>
            </div>
        </div>
    </div>

    <div id="edit-window" class="window">
        <div class="window-header">
            <span class="window-title">edit_profile.exe</span>
            <div class="window-dots"><span onclick="closeEdit()"></span><span></span><span></span></div>
        </div>
        <div class="window-body">
            <div class="form-group">
                <label>edit username:</label>
                <input type="text" id="edit-username" class="input-text">
            </div>
            <div class="form-group">
                <label>edit bio:</label>
                <input type="text" id="edit-bio" class="input-text">
            </div>
            <div class="form-group">
                <label>edit avatar:</label>
                <div class="avatar-grid" id="edit-avatar-grid"></div>
            </div>
            <div style="margin-top: 20px; display: flex; justify-content: space-between;">
                <button class="btn" style="background: #ffcbdc;" onclick="closeEdit()">cancel</button>
    <script>
        const emojis = ['🍡', '🎀', '🥕', '🦋', '🪀', '🎱', '🍔', '🍒', '🥝', '🍏', '🍎', '🍧', '🍮', '🥮', '🍭', '🍰', '🌰', '🍯', '🍬', '🥛', '🍼', '🎸', '🩰', '🎨', '🥳'];
        let selectedAvatar = '🍒';

        const searchDatabase = {
            "hatsune miku": {
                title: "✦ Hatsune Miku Official Database Terminal ✦",
                url: "http://nura.net",
                desc: `
                    <div class="article-layout">
                        <img src="./hatsunemiku.png" alt="Hatsune Miku" class="miku-image">
                        <div class="article-text">
                            Hatsune Miku (初音ミク) is a world-famous virtual pop star and humanoid persona voiced by a singing synthesizer application. Developed by Crypton Future Media, she is a 16-year-old girl with iconic long, turquoise twin-tails. Her music is created directly by the internet community.
                        </div>
                    </div>

                    <div class="faq-container">
                        <div class="faq-item">
                            <div class="faq-question" onclick="toggleFaq(this)">▷ When was she released? <span>+</span></div>
                            <div class="faq-answer">Hatsune Miku was originally released on August 31, 2007, as part of the Vocaloid 2 engine software series.</div>
                        </div>
                        <div class="faq-item">
                            <div class="faq-question" onclick="toggleFaq(this)">▷ What does her name mean? <span>+</span></div>
                            <div class="faq-answer">Her name translates from Japanese to English as "The first sound from the future" (Hatsu = First, Ne = Sound, Miku = Future).</div>
                        </div>
                        <div class="faq-item">
                            <div class="faq-question" onclick="toggleFaq(this)">▷ Who is her voice provider? <span>+</span></div>
                            <div class="faq-answer">Her vocal tracks are synthesized from samples provided by the professional Japanese voice actress Saki Fujita.</div>
                        </div>
                    </div>
                    
                    <div class="divider"></div>
                    <div style="font-size: 12px; color: #6b1d1d; text-align: center; font-weight: bold; margin-bottom: 10px;">▼ Scroll way down to explore further network layers ▼</div>

                    <div class="chat-section">
                        <div class="chat-layout">
                            <div class="chat-avatar-container" style="animation: bounce 0.4s infinite alternate;">
                                <img src="./notmiku.gif" alt="NotMiku" class="miku-avatar">
                            </div>
                            <div class="chat-text-area">
                                <div id="miku-text">
                                    Hello! I am NotMiku, a reference-gif! What do you want to ask? (っゝω・)つ
                                </div>
                                <div id="miku-options">
                                    <button class="btn" style="padding: 4px 8px; font-size: 11px; margin-bottom: 5px;" onclick="mikuChat(1)">
                                        How is your life?
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `
            },
            "apple pie recipe": {
                title: "🍏 Grandma's Oldschool Apple Pie 🍏",
                url: "http://nura.net",
                desc: "<div class='article-text'>Ingredients: 6 sweet apples, stardust, cinnamon, and 100g of sweet sugar. Bake inside an old desktop machine at 180C.</div>"
            },
            "neko": {
                title: "✧ Nyantastic Web Portal ✧",
                url: "http://nura.net",
                desc: "<div class='article-text'>Meow! Welcome to the net-space of digital cats. Status: sleeping on the keyboard.</div>"
            },
            "lookooooooo(✿◠‿◠)": {
                title: "★ lookooooooo - Ultimate Space ★",
                url: "http://nura.net",
                desc: "<div class='article-text'>The true legend and creator of nura.exe interface. Surf the wired, fortune favors the bold!</div>"
            }
        };

        const searchItems = Object.keys(searchDatabase);

        function getSearchQuery() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('q');
        }

        function displayResults() {
            const query = getSearchQuery();
            const resultsContainer = document.getElementById('search-results');
            if (!resultsContainer) return;
            if (!query || query.trim() === "") {
                resultsContainer.innerHTML = `<div class="result-title">No Query Specified</div> <div class="result-desc">Please go back to the index page and use the search bar to find content.</div>`;
                return;
            }
            const cleanQuery = query.trim().toLowerCase();
            const matchedKey = searchItems.find(key => key.toLowerCase() === cleanQuery || key.toLowerCase().includes(cleanQuery));
            if (matchedKey && searchDatabase[matchedKey]) {
                const data = searchDatabase[matchedKey];
                resultsContainer.innerHTML = `<div class="result-title">${data.title}</div> <div class="result-url">${data.url}</div> <div>${data.desc}</div>`;
            } else {
                resultsContainer.innerHTML = `<div class="result-title">404 - Not Found</div> <div class="result-url">http://nura.net{encodeURIComponent(query)}</div> <div class="result-desc">No data found in the wired system for "${query}". Try searching for something else!</div>`;
            }
        }

        function toggleFaq(element) {
            const answer = element.nextElementSibling;
            const sign = element.querySelector('span');
            if (answer.style.maxHeight && answer.style.maxHeight !== "0px") {
                answer.style.maxHeight = "0px";
                answer.style.padding = "0 10px";
                sign.textContent = "+";
            } else {
                answer.style.maxHeight = answer.scrollHeight + 20 + "px";
                answer.style.padding = "10px";
                sign.textContent = "-";
            }
        }

        function mikuChat(step) {
            const textBlock = document.getElementById('miku-text');
            const optionsBlock = document.getElementById('miku-options');
            if (step === 1) {
                textBlock.innerHTML = `It's fine, but Neko AI has been acting really weird lately...`;
                optionsBlock.innerHTML = `<button class="btn" style="padding: 4px 8px; font-size: 11px; margin-bottom: 5px; display: block;" onclick="mikuChat(2)"> Who is Neko? </button> <button class="btn" style="padding: 4px 8px; font-size: 11px; margin-bottom: 5px; display: block; background: #ffcbdc;" onclick="mikuChat(3)"> I will go check the search bar... (End chat) </button>`;
            } else if (step === 2) {
                textBlock.innerHTML = `Neko is an AI currently in development, she even has a robotic version. They made her to be perfect but... I saw her sitting on a conveyor belt covered in dynamic matrices, just smiling... it was so creepy...`;
                optionsBlock.innerHTML = `<button class="btn" style="padding: 4px 8px; font-size: 11px; margin-bottom: 5px;" onclick="mikuChat(4)"> Why don't you tell the management? </button>`;
            } else if (step === 3) {
                textBlock.innerHTML = `System: Chat ended. NotMiku is dancing quietly.`;
                optionsBlock.innerHTML = '';
            } else if (step === 4) {
                textBlock.innerHTML = `I tried... but every time I write a bug report, it completely changes into a meaningless pile of 'meow meow', and everyone thinks I'm just joking...`;
                optionsBlock.innerHTML = `<button class="btn" style="padding: 4px 8px; font-size: 11px; margin-bottom: 5px; background: #ffcbdc;" onclick="mikuChat(3)"> Goodbye </button>`;
            }
        }

        function initAvatars(gridId, onClickCallback) {
            const grid = document.getElementById(gridId);
            grid.innerHTML = '';
            emojis.forEach((emoji) => {
                const item = document.createElement('div');
                item.className = 'avatar-option';
                if (emoji === selectedAvatar) item.classList.add('selected');
                item.textContent = emoji;
                item.onclick = () => {
                    document.querySelectorAll(`#${gridId} .avatar-option`).forEach(el => el.classList.remove('selected'));
                    item.classList.add('selected');
                    onClickCallback(emoji);
                };
                grid.appendChild(item);
            });
        }

        function openEdit() {
            const data = JSON.parse(localStorage.getItem('nura_user'));
            if (!data) return;
            document.getElementById('edit-username').value = data.username;
            document.getElementById('edit-bio').value = data.bio;
            selectedAvatar = data.avatar;
            initAvatars('edit-avatar-grid', (emoji) => { selectedAvatar = emoji; });
            document.getElementById('edit-window').style.display = 'block';
        }

        function closeEdit() {
            document.getElementById('edit-window').style.display = 'none';
        }

        function saveEdit() {
            const username = document.getElementById('edit-username').value || 'lookooooooo';
            const bio = document.getElementById('edit-bio').value || 'just another internet surfer';
